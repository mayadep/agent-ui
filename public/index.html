<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>agent-ui</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230d0f12'/%3E%3Ccircle cx='8' cy='8' r='4' fill='%23b48cff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="term">
    <div class="titlebar">
      <span class="dots"><i class="dot red"></i><i class="dot yellow"></i><i class="dot green"></i></span>
      <select id="session-select" aria-label="session"></select>
      <span id="conn" class="conn">connecting…</span>
    </div>
    <header id="header" class="header"></header>
    <main class="grid">
      <aside id="goal" class="goal"></aside>
      <section id="flow" class="flow"></section>
    </main>
    <footer class="logwrap">
      <div class="log-title">session log</div>
      <div id="log" class="log"></div>
    </footer>
  </div>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
